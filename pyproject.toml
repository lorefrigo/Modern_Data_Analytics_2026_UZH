[project]
name = "mda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.6.0",
    "numpy>=2.5.4",
    "osfclient>=0.0.5",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lcm_recheck"

[tool.pytest.ini_options]
testpaths = ["tests"]          # never collect the authors' tests under lcm-eval/
markers = ["db: needs the PostgreSQL server on port 5418 (skips itself when unreachable)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120               # the line length the code uses; E501 itself is not enabled
extend-exclude = ["lcm-eval"]   # the authors' repo and downloaded data; never linted
